{% extends "base.html" %}

{% block title %}Editar Evento{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-slate-200">
    <h2 class="text-2xl font-bold text-slate-900 mb-6">Editar Evento</h2>

    <form action="/ui/edit/{{ event.id }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Título</label>
            <input type="text" name="title" value="{{ event.title }}" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Data</label>
            <input type="date" name="date" value="{{ event.date }}" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Organizador</label>
            <input type="text" name="organizer" value="{{ event.organizer }}" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Local</label>
            <input type="text" name="location" value="{{ event.location }}" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Imagem (URL)</label>
            <input type="url" name="image" value="{{ event.image if event.image else '' }}" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Tags (separadas por vírgula)</label>
            <input type="text" name="tags" value="{{ event.tags | join(', ') if event.tags else '' }}" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Descrição</label>
            <textarea name="description" rows="4" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">{{ event.description }}</textarea>
        </div>

        <div class="flex justify-end space-x-3 pt-4">
            <a href="/ui" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200">Cancelar</a>
            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Salvar Alterações</button>
        </div>
    </form>
</div>
{% endblock %}
