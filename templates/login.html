<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - FastAPI Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-md border border-slate-200 p-8">
        <div class="text-center mb-6">
            <span class="text-4xl">📅</span>
            <h1 class="text-2xl font-bold text-slate-900 mt-2">Painel de Operações</h1>
            <p class="text-xs text-slate-500">Insira suas credenciais para continuar</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-xs font-semibold">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="/ui/login" method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Utilizador</label>
                <input type="text" id="username" name="username" required
                    class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Palavra-passe</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm py-2.5 rounded-lg transition-colors shadow-sm mt-2">
                Entrar no Sistema
            </button>
        </form>
    </div>
</body>
</html>
