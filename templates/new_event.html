{% extends "base.html" %}

{% block title %}Cadastrar Novo Evento - FastAPI Eventos{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200">
    <div class="mb-6 pb-4 border-b border-slate-100 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Cadastrar Novo Evento</h1>
            <p class="text-sm text-slate-500 mt-1">Preencha os dados abaixo para criar um novo registro.</p>
        </div>
        <span class="text-3xl">📝</span>
    </div>

    <form action="/ui/new" method="POST" class="space-y-5">
        <div>
            <label for="title" class="block text-sm font-semibold text-slate-700 mb-1">Título do Evento</label>
            <input type="text" id="title" name="title" placeholder="Ex: FastAPI Book Launch" required
                class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="date" class="block text-sm font-semibold text-slate-700 mb-1">Data</label>
                <input type="date" id="date" name="date" required
                    class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
            </div>

            <div>
                <label for="organizer" class="block text-sm font-semibold text-slate-700 mb-1">Organizador</label>
                <input type="text" id="organizer" name="organizer" placeholder="Ex: Comunidade Python" required
                    class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
            </div>
        </div>

        <div>
            <label for="image" class="block text-sm font-semibold text-slate-700 mb-1">URL da Imagem (Opcional)</label>
            <input type="url" id="image" name="image" placeholder="https://exemplo.com/imagem.png"
                class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
        </div>

        <div>
            <label for="description" class="block text-sm font-semibold text-slate-700 mb-1">Descrição</label>
            <textarea id="description" name="description" rows="4" required placeholder="Detalhes do evento..."
                class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="tags" class="block text-sm font-semibold text-slate-700 mb-1">Tags (separadas por vírgula)</label>
                <input type="text" id="tags" name="tags" placeholder="python, fastapi, backend"
                    class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
            </div>

            <div>
                <label for="location" class="block text-sm font-semibold text-slate-700 mb-1">Localização</label>
                <input type="text" id="location" name="location" placeholder="Ex: Google Meet ou Lisboa" required
                    class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
            </div>
        </div>

        <div class="flex items-center justify-between pt-6 mt-6 border-t border-slate-100">
            <a href="/ui" class="inline-flex items-center text-sm font-medium text-slate-600 hover:text-indigo-600 transition-colors">
                ← Voltar para a lista de eventos
            </a>
            <button type="submit" 
                class="inline-flex items-center justify-center px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500">
                Salvar Evento
            </button>
        </div>
    </form>
</div>
{% endblock %}
