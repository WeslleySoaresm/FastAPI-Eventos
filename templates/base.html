<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FastAPI Eventos{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho Compartilhado -->
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <span class="text-2xl">📅</span>
                <a href="/ui" class="text-xl font-bold tracking-tight hover:text-indigo-100 transition-colors">FastAPI Eventos</a>
                <a href="/ui/audit" class="hover:text-indigo-200 transition-colors text-sm font-medium">Auditoria CIA</a>
                <a href="/ui/new" class="bg-indigo-500 hover:bg-indigo-400 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-colors">
                    + Cadastrar Evento
                </a>
            </div>
            
            <div class="flex items-center space-x-3">
                <span class="bg-indigo-700 text-indigo-100 text-xs px-3 py-1 rounded-full font-medium">Painel de Operações</span>
                <!-- Botão de Sair / Logout -->
                <a href="/ui/logout" class="bg-red-500 hover:bg-red-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors shadow-sm flex items-center space-x-1">
                    <span>🚪</span>
                    <span>Sair</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Dinâmico -->
    <main class="max-w-7xl mx-auto px-6 py-8 mb-auto w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé Compartilhado -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500">
        <p>© 2026 FastAPI Eventos - Painel Interno de Operações</p>
    </footer>

</body>
</html>
